{% load i18n %}<!DOCTYPE html
     PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
     "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
    dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}"
    xml:lang="{% firstof LANGUAGE_CODE 'en' %}"
    lang="{% firstof LANGUAGE_CODE 'en' %}">
  <head>
    <title>{% block title %}Authentication{% endblock %} - Helios</title>
    {% block css %}
      <!--
          <link rel="stylesheet" type="text/css"  media="screen, projection" href="{{ MEDIA_URL }}combined-{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}.css" />
      -->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
      <link rel="stylesheet" type="text/css" media="screen" href="/static/main.css">

    {% endblock %}
    {% include "_branding_theme.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block js %}
    {% endblock %}

    {% block extra-head %}{% endblock %}
  </head>

  <body>
    <div id="content">
        <div id="header">
        {% block header %}
        {% endblock %}
        <form action="{% url "set_language" %}" method="post" style="display:inline; float:right;">
          <input type="hidden" name="csrf_token" value="{{csrf_token}}" />
          <input type="hidden" name="next" value="{{CURRENT_URL}}" />
          <select name="language" class="form-select form-select-sm d-inline-block w-auto" onchange="this.form.submit()">
            {% get_current_language as CURRENT_LANGUAGE %}
            <option value="en" {% if CURRENT_LANGUAGE == "en" %}selected{% endif %}>English</option>
            <option value="es" {% if CURRENT_LANGUAGE == "es" %}selected{% endif %}>Español</option>
          </select>
        </form>
        </div>
      {% block content %}{% endblock %}
      <div id="footer">
      </div>
    </div>
    
  </body>
</html>
